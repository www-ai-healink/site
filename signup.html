<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Parentacare</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>

<div class="screen">

   <!-- back button -->
<a href="index.html" class="btn-back">
  <img src="assets2/back.png" alt="Back">
</a>

  <!-- wallpaper -->
  <img src="assets2/wallpaper.png" class="wallpaper" alt="">

  <div class="content">

    <!-- logo -->
    <img src="assets2/logo-login.png" class="logo" alt="Logo">

    <!-- title -->
    <img src="assets2/signupto.png" class="title-img" alt="Sign Up">

    <!-- gender -->
    <div class="gender">
  <label>
    <input type="radio" name="gender" value="male">
    <img src="assets2/male.png" alt="Male">
  </label>

  <label>
    <input type="radio" name="gender" value="female">
    <img src="assets2/female.png" alt="Female">
  </label>
</div>


 

    <!-- form -->
    <form class="signup-form">

<div class="bagian bagian1">

    <img src="assets2/Fullname.png" class="fieldFullname">
  <div class="field-box">
    <input type="text" placeholder="Enter your full name">
  </div>

    <img src="assets2/Region.png" class="fieldregion">
  <div class="field-box">
    <input type="text" placeholder="Enter your region">
  </div>

</div>

<div class="bagian bagian2">

    <img src="assets2/Email3.png" class="fieldemail">
<div class="field-box">
    <input type="email" placeholder="Enter your email">
  </div>

    <img src="assets2/Password3.png" class="fieldpassword">
<div class="field-box">
    <input type="password" placeholder="Enter your password">
  </div>

    <img src="assets2/ConfirmPassword.png" class="fieldconfirmpassword">
<div class="field-box">
    <input type="password" placeholder="Confirm your password">
  </div>

</div>
<!-- button -->
  <a href="ab.html" class="btn-img">
    <img src="assets2/signupbtn.png">
  </a>

</form>




  </div>
</div>

</html>
